name: CRM access and block regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python source
        run: |
          python -m compileall -q bot.py crm.py database.py settings.py tests
          if [ -f crm_runtime.py ]; then python -m compileall -q crm_runtime.py; fi
      - name: Run regression tests
        run: python -m pytest -q
